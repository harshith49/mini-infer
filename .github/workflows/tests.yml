name: CPU correctness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HOME: ${{ github.workspace }}/model_cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build CPU container
        run: docker build -t mini-infer .
      - name: Check container generation
        run: docker run --rm -v "$PWD/model_cache:/app/model_cache" mini-infer python -m engine.generate --device cpu --prompt "Hello, world!" --max-new-tokens 50 --use-cache
      - name: Check container server
        run: |
          docker run -d --name mini-infer-smoke -p 127.0.0.1:8000:8000 -v "$PWD/model_cache:/app/model_cache" mini-infer
          trap 'docker logs mini-infer-smoke; docker rm -f mini-infer-smoke' EXIT
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 http://127.0.0.1:8000/openapi.json > /dev/null
          curl --fail --max-time 60 -N http://127.0.0.1:8000/v1/generate -H 'Content-Type: application/json' -d '{"prompt":"Hello, world!","max_new_tokens":2,"stop_token_ids":[]}' > /tmp/container-sse.txt
          python - <<'CHECK'
          import json
          from pathlib import Path
          blocks = Path('/tmp/container-sse.txt').read_text().strip().split('\n\n')
          events = [(block.splitlines()[0], json.loads(block.splitlines()[1].removeprefix('data: '))) for block in blocks]
          assert [event for event, _ in events] == ['event: token', 'event: token', 'event: done']
          done = events[-1][1]
          assert done['finish_reason'] == 'length' and done['usage']['completion_tokens'] == 2
          assert done['token_ids'] == [data['token_id'] for _, data in events[:-1]]
          print('Container SSE generation passed')
          CHECK
